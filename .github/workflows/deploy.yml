name: Deploy to Infomaniak

# Uploads the site to https://galan.cloud/jung/ over FTPS (FTP with TLS,
# port 21) when a release is published. It can also be run by hand from the
# Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://galan.cloud/jung/
    env:
      FTP_HOST: ${{ secrets.SFTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
      FTP_USER: ${{ secrets.SFTP_USER }}
      FTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      FTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
    steps:
      - name: Check out the released code
        uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=0
          for v in FTP_HOST FTP_USER FTP_PASSWORD FTP_REMOTE_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Upload over FTPS
        run: |
          # Files that make up the site. Add new ones here.
          files="index.html"

          # Folder on the server, relative to the FTP login folder, without
          # leading or trailing slashes.
          dir="${FTP_REMOTE_PATH#/}"; dir="${dir%/}"
          base="ftp://$FTP_HOST:$FTP_PORT/$dir"

          # Keep the password out of the command line and the logs. A curl
          # config file copes with spaces and symbols in the password.
          umask 077
          esc() { printf '%s' "$1" | sed 's/[\\"]/\\&/g'; }
          printf 'user = "%s:%s"\n' "$(esc "$FTP_USER")" "$(esc "$FTP_PASSWORD")" > "$RUNNER_TEMP/curl-auth"

          for f in $files; do
            echo "Uploading $f to /$dir/"
            # Upload to a temporary name, then swap it in, so visitors never
            # get a half-written page. "-" runs a command after the upload,
            # "*" lets it fail (the old file may not exist).
            curl --fail --show-error --silent --ssl-reqd \
              --config "$RUNNER_TEMP/curl-auth" \
              --retry 3 --connect-timeout 20 \
              -T "$f" "$base/$f.uploading" \
              -Q "-*DELE $f" \
              -Q "-RNFR $f.uploading" \
              -Q "-RNTO $f"
          done

      - name: Check the live site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 https://galan.cloud/jung/)
          echo "https://galan.cloud/jung/ returned HTTP $code"
          [ "$code" = "200" ]

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/curl-auth"
